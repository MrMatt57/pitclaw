[env:wt32_sc01_plus]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:scripts/strip_lovyangfx_lvgl.py
build_src_filter =
    +<*>
    -<simulator/>
    -<bench/>
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
upload_speed = 921600

; LittleFS for web UI files and config
board_build.filesystem = littlefs

lib_deps =
    adafruit/Adafruit ADS1X15@2.6.2
    dlloydev/QuickPID@3.1.9
    bblanchon/ArduinoJson@7.4.2
    ESP32Async/ESPAsyncWebServer@3.9.6
    ESP32Async/AsyncTCP@3.4.10
    lvgl/lvgl@9.4.0
    lovyan03/LovyanGFX@1.2.20
    tzapu/WiFiManager@2.0.17
    ayushsharma82/ElegantOTA@3.1.7

build_flags =
    -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL config
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_TICK_PERIOD_MS=5
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_36=1
    -DLV_FONT_MONTSERRAT_48=1
    -DLV_USE_QRCODE=1

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags =
    -DUNIT_TEST
    -DNATIVE_BUILD
    -Isrc
lib_deps =
    throwtheswitch/Unity@2.6.1
    bblanchon/ArduinoJson@7.4.2
test_filter = test_desktop/*

[env:simulator]
platform = native@1.2.1
build_flags =
    -DSIMULATOR_BUILD
    -DLV_CONF_SKIP=1
    -DLV_TICK_PERIOD_MS=5
    -DLV_COLOR_DEPTH=32
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_16=1
    -DLV_FONT_MONTSERRAT_18=1
    -DLV_FONT_MONTSERRAT_24=1
    -DLV_FONT_MONTSERRAT_36=1
    -DLV_FONT_MONTSERRAT_48=1
    -DLV_USE_QRCODE=1
    -DLV_USE_SDL=1
    -DLV_MEM_SIZE=262144
    -Isrc
    -DMG_ENABLE_PACKED_FS=0
lib_deps =
    lvgl/lvgl@9.4.0
    bblanchon/ArduinoJson@7.4.2
build_src_filter =
    -<*>
    +<simulator/>
    +<display/>
    +<web_protocol.cpp>
extra_scripts = sdl2_setup.py

; Serial-only commissioning: no PID, Wi-Fi, display, or automatic output motion.
[env:bench]
extends = env:wt32_sc01_plus
extra_scripts =
lib_deps =
    adafruit/Adafruit ADS1X15@2.6.2
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    -<*>
    +<bench/>
    +<temp_manager.cpp>
